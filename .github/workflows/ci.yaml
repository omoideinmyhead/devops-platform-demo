name: Verify and build
on:
  push:
    branches: [main, 'feature/**']
    # ★ 改动 1：只改了部署版本号的推送不跑 CI（包括 CI 自己提交的版本更新、手动回滚）
    paths-ignore:
      - 'k8s/kustomization.yaml'
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          READING_MODE: demo
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # 允许往 GHCR 推镜像（只给这一个 job）
    env:
      # 只有"推送到 main"时才为 true；PR 和 feature 分支只构建、不推送
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub 每次运行自动生成的临时令牌，不用自己配置

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/tarot-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/tarot-backend:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/tarot-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/tarot-frontend:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
  
  # ★ 改动 2：镜像推送成功后，把 newTag 改成这次的 SHA 并提交回 main
  deploy:
    needs: containers
    # 只在合并进 main 时运行；PR 和 feature 分支不部署
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 允许往仓库提交 commit（只给这一个 job）
    concurrency:
      group: deploy-main       # 同一时间只允许一个部署任务，避免两次合并同时改文件
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point Kustomize at the new image tag
        run: |
          sed -i -E "s/^(\s*newTag:\s*).*/\1${GITHUB_SHA}/" k8s/kustomization.yaml
          # 确认两个镜像都改成了新 SHA，没改对就让这一步失败
          test "$(grep -c "newTag: ${GITHUB_SHA}" k8s/kustomization.yaml)" -eq 2
          git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Already pointing at ${GITHUB_SHA}, nothing to deploy"
            exit 0
          fi
          git commit -m "Deploy ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main