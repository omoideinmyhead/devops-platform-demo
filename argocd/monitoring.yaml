apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    # Directly reference the public Helm chart; no copy of the chart in this repo
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.11.0
    helm:
      releaseName: monitoring
      valuesObject:
        prometheus:
          prometheusSpec:
            # Pick up ServiceMonitors/PodMonitors/rules from any namespace,
            # not only ones labelled for this Helm release
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 3d
        # These control-plane components are not reachable on minikube;
        # disable them so they don't show up as permanently DOWN
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true          # the stack's CRDs are too large for client-side apply
      - RespectIgnoreDifferences=true
  # The operator's webhook certificates are generated at runtime;
  # ignore them so the app doesn't stay OutOfSync forever
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle