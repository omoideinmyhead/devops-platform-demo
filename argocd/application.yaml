apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tarot
  namespace: argocd              # Application 本身属于 ArgoCD，放在 argocd 命名空间
spec:
  project: default

  # 从哪里读配置
  source:
    repoURL: https://github.com/omoideinmyhead/devops-platform-demo.git
    targetRevision: main         # 只跟踪 main 分支
    path: k8s                    # 读这个目录；里面有 kustomization.yaml，ArgoCD 会自动用 Kustomize 渲染

  # 部署到哪里
  destination:
    server: https://kubernetes.default.svc   # 就是 ArgoCD 所在的这个集群
    namespace: default

  # 自动同步策略
  syncPolicy:
    automated:
      prune: true      # Git 里删掉的资源，集群里也删掉
      selfHeal: true   # 有人手动改了集群，自动改回 Git 里的状态