apiVersion: v1
kind: Service
metadata:
  name: tarot-backend
  labels:
    app: tarot-backend      # 新增：ServiceMonitor 靠这个标签找到 Service
spec:
  selector:
    app: tarot-backend
  ports:
    - name: http            # 新增：ServiceMonitor 按名字引用端口
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: tarot-frontend
spec:
  selector:
    app: tarot-frontend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
  type: NodePort
