apiVersion: v1
kind: Service
metadata:
  name: tarot-backend
spec:
  selector:
    app: tarot-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: tarot-frontend
spec:
  selector:
    app: tarot-frontend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
  type: NodePort
