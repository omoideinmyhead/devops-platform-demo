apiVersion: v1
kind: Service
metadata:
  name: tarot-backend
  labels:
    app: tarot-backend      # the ServiceMonitor selects this Service by label
spec:
  selector:
    app: tarot-backend
  ports:
    - name: http            # the ServiceMonitor refers to this port by name
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: tarot-frontend
spec:
  selector:
    app: tarot-frontend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
  type: NodePort
