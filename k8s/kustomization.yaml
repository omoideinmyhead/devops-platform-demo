apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 要部署哪些文件。ingress.yaml 没放进来，本地集群不需要它。
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

# 部署哪个版本：把 deployment 里同名的镜像统一替换成这个 tag
images:
  - name: ghcr.io/omoideinmyhead/tarot-backend
    newTag: d1c28e4b9d0c07bd0dab43689979799163ee1e12
  - name: ghcr.io/omoideinmyhead/tarot-frontend
    newTag: d1c28e4b9d0c07bd0dab43689979799163ee1e12