apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 要部署哪些文件。ingress.yaml 没放进来，本地集群不需要它。
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# 部署哪个版本：把 deployment 里同名的镜像统一替换成这个 tag
images:
  - name: ghcr.io/omoideinmyhead/tarot-backend
    newTag: 05a16f2682c2b0b2f6a364303194e6c859230023
  - name: ghcr.io/omoideinmyhead/tarot-frontend
    newTag: 05a16f2682c2b0b2f6a364303194e6c859230023