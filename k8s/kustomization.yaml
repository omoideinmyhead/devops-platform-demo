apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 要部署哪些文件。ingress.yaml 没放进来，本地集群不需要它。
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

# 部署哪个版本：把 deployment 里同名的镜像统一替换成这个 tag
images:
  - name: ghcr.io/omoideinmyhead/tarot-backend
    newTag: 5beb2e8cb4f795bf17a06d54ec21c6a73b16447b
  - name: ghcr.io/omoideinmyhead/tarot-frontend
    newTag: 5beb2e8cb4f795bf17a06d54ec21c6a73b16447b