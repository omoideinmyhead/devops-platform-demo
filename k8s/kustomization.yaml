apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources Argo CD deploys. ingress.yaml is not included: local clusters don't need it.
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

# The Grafana dashboard is kept as a plain JSON file and wrapped into a ConfigMap.
# Grafana's sidecar loads every ConfigMap labelled grafana_dashboard=1 in the monitoring namespace.
configMapGenerator:
  - name: tarot-dashboard
    namespace: monitoring
    files:
      - dashboards/tarot-red.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

# Deployed version. CI updates newTag to the commit SHA after every merge to main.
images:
  - name: ghcr.io/omoideinmyhead/tarot-backend
    newTag: 6cd9c5d750348e399fd8f5788e0dc59801e04a47
  - name: ghcr.io/omoideinmyhead/tarot-frontend
    newTag: 6cd9c5d750348e399fd8f5788e0dc59801e04a47