apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-platform-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-platform-demo
  template:
    metadata:
      labels:
        app: devops-platform-demo
    spec:
      containers:
        - name: devops-platform-demo
          image: devops-platform-demo:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000